# À placer dans .github/workflows/archive-ensembles.yml, avec archive_ensembles.py à la racine du dépôt.
name: Archive ensembles Open-Meteo

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h (UTC) ; les doublons sont ignorés par le script
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # pour pouvoir committer les fichiers Parquet

concurrency: archive-ensembles

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pyarrow
      - run: python archive_ensembles.py
      - name: Commit des nouveaux runs
        if: always()          # on garde ce qui a réussi même si un modèle a échoué
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || (git commit -m "archive $(date -u +%Y-%m-%dT%HZ)" && git pull --rebase && git push)
